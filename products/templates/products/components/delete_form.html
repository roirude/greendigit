<div class="fixed w-full h-full bg-black bg-opacity-50 -z-20 top-0 left-0 flex flex-col justify-center items-center">
    <div class="bg-white flex w-full max-w-md rounded-md">
        <div class="bg-red-500 flex flex-col items-center px-5 justify-center">
            <span class="material-symbols-outlined text-5xl">
                delete_forever
            </span>
        </div>
        <div class="p-5">
            <h2 class="text-2xl font-semibold text-red-500 uppercase mb-2">Warming!</h2>
            <h3 class="text-lg font-semibold mb-2">Are you sure you want to delete <span id="product_name" class="text-red-500">{{ name }}</span> ?</h3>
            <div class="flex gap-4">
                <a id="product_delete_url" href="{{ delete_url }}" class="btn btn-error">Yes, I'm Sure</a>
                <a href="#" onclick="closePopup()" class="btn btn-primary">No, Cancel</a>
            </div>
        </div>
    </div>
</div>
