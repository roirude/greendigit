{% load static %}
<div class="bg-white shadow-md hover:shadow-primary-800 transition-shadow ease-linear ">
    <a href="{% url 'farmer_detail' farmer.slug %}" class="">
        {% if farmer.cover %}
        <img src="{{ farmer.cover.url }}" alt="{{ farmer.firstname }}" class="min-w-full h-56 object-cover">
        {% else %}
        <img src="{% static 'src/images/users/banner.png' %}" alt="user_banner" class="min-w-full h-56 object-cover">
        {% endif %}
    </a>
    <div class="p-4">
        <div class="flex items-center justify-between">
            <a href="{% url 'farmer_detail' farmer.slug %}" class="flex items-center gap-2">
                {% if farmer.avatar %}
                    <img src="{{ farmer.avatar.url }}" alt="{{farmer.firstname }}" class="w-12 h-12 rounded-full object-cover">
                {% else %}
                    <div class=" hover:cursor-pointer uppercase bg-primary-500 hover:bg-primary-400 w-12 h-12 flex items-center justify-center text-3xl rounded-full font-bold">
                        {{ farmer.email|slice:"1" }}
                    </div>
                {% endif %}
                <h2 class="capitalize text-xl font-semibold ">
                    {% if farmer.fullname %}
                    {{ farmer.fullname }}
                    {% else %}
                    {{ farmer.email|slice:":5"}}
                    {% endif %}
                </h2>
            </a>
            <div class="font-bold uppercase bg-primary-800 p-2 text-white rounded-md">
                pro
            </div>
        </div>
        <div class="flex items-center text-xl pt-4 text-primary-800 gap-1">
            <span class="material-symbols-outlined">
                star
            </span>
            <p>
                <span class="font-semibold">
                    5.0
                </span>
                <span class="text-gray-600">(240)</span>
            </p>
        </div>
        <div class="text-gray-500 font-medium pt-4">
            {{ farmer.description|slice:":50"}}
        </div>
    </div>
</div>
